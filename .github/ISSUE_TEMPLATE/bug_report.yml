name: Bug report
description: Report a reproducible problem with Venus
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove API keys, QQ AppSecrets, openids,
        chat text and database contents before posting. Security issues should
        follow SECURITY.md instead of a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Send ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect instead?
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 / commit hash
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.13, model provider ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant status logs
      description: Remove secrets, openids and chat content.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed all secrets, openids and private chat data from this report.
          required: true
        - label: I searched existing issues before opening this one.
          required: true
