name: Feature request
description: Suggest a capability or improvement for Venus
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Venus deliberately keeps its
        core standard-library only, so new runtime dependencies need a reason.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is not met today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Venus do differently?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds or prior art.
  - type: textarea
    id: scope
    attributes:
      label: Scope and risks
      description: Does this affect privacy, dependencies, QQ behavior or existing data?
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions before opening this one.
          required: true
