[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venus-companion"
version = "0.1.0"
description = "A personal chat companion for QQ and the terminal, with JSON personas and long-term memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Venus contributors" }]
keywords = [
    "ai-companion",
    "chatbot",
    "local-first",
    "persona",
    "qq-bot",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
qq = ["qq-botpy>=1.2,<2"]

[project.scripts]
venus = "venus.__main__:main"
venus-doctor = "venus.doctor:main"
venus-pair = "venus.pair_cli:main"
venus-qq = "venus.qq_bot:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["venus*", "personas*"]

[tool.setuptools.package-data]
personas = ["*.json"]
